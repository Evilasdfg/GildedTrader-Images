name: Convert README screenshots to JPEG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/convert-readme-screenshots.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert PNG screenshots to high-quality JPEG
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          mapping = {
              "images/trader-shop.png": "images/trader-shop.jpg",
              "images/trader-search.png": "images/trader-search.jpg",
              "images/bank-vault.png": "images/bank-vault.jpg",
              "images/gilded-wallet-pocket-change.png": "images/gilded-wallet-pocket-change.jpg",
          }

          for source, target in mapping.items():
              src = Path(source)
              dst = Path(target)
              with Image.open(src) as image:
                  image.convert("RGB").save(
                      dst,
                      "JPEG",
                      quality=95,
                      subsampling=0,
                      optimize=True,
                  )
              src.unlink()
          PY

      - name: Remove one-shot workflow and commit converted images
        run: |
          rm .github/workflows/convert-readme-screenshots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convert public screenshots to JPEG"
          git push
